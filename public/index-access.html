<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HRC Results - Access</title>
  <link rel="stylesheet" href="./styles.css">
  <style>
    .auth-container {
      max-width: 450px;
      margin: 50px auto;
      padding: 30px;
      background: white;
      border-radius: 8px;
      box-shadow: 0 0 10px #ccc;
    }
    .auth-form {
      margin: 20px 0;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
      color: #333;
      font-size: 14px;
    }
    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 16px;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      padding: 12px;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      font-size: 16px;
      transition: background-color 0.3s;
    }
    button:hover {
      background-color: #0056b3;
    }
    button:disabled {
      background-color: #ccc;
      cursor: not-allowed;
    }
    .hidden {
      display: none;
    }
    .error {
      color: #d32f2f;
      margin-top: 10px;
      font-size: 14px;
    }
    .success {
      color: #28a745;
      margin-top: 10px;
      font-size: 14px;
    }
    .divider {
      text-align: center;
      margin: 30px 0;
      position: relative;
    }
    .divider::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 0;
      right: 0;
      height: 1px;
      background: #ddd;
    }
    .divider span {
      background: white;
      padding: 0 10px;
      position: relative;
      color: #999;
      font-size: 14px;
    }
    .admin-link {
      text-align: center;
      margin-top: 20px;
    }
    .admin-link a {
      color: #007bff;
      text-decoration: none;
      font-weight: bold;
    }
    .admin-link a:hover {
      text-decoration: underline;
    }
    #recaptcha-container {
      margin-bottom: 20px;
      display: flex;
      justify-content: center;
    }
  </style>
</head>
<body>

<div class="auth-container">
  <h2 style="text-align: center; margin-bottom: 10px;">HRC Results</h2>
  <p style="text-align: center; color: #999; margin-bottom: 30px;">Access Results Portal</p>

  <!-- Step 1: Phone Entry -->
  <div id="phone-step" class="auth-form">
    <p style="font-size: 14px; color: #666; margin-bottom: 15px;">Enter your phone number to receive OTP</p>
    <div class="form-group">
      <label for="phone">Phone Number (10 digits):</label>
      <div style="display: flex; gap: 10px; align-items: center;">
        <input type="text" value="+91" disabled style="flex: 0 0 60px; background: #f5f5f5; text-align: center;">
        <input type="tel" id="phone" placeholder="9876543210" maxlength="10" required style="flex: 1;">
      </div>
    </div>
    <div id="recaptcha-container"></div>
    <button id="send-otp">Send OTP</button>
    <div id="phone-error" class="error"></div>
  </div>

  <!-- Step 2: OTP Verification -->
  <div id="otp-step" class="auth-form hidden">
    <p style="font-size: 14px; color: #666; margin-bottom: 15px;">Enter the OTP sent to your phone</p>
    <div class="form-group">
      <label for="otp">One-Time Password:</label>
      <input type="text" id="otp" placeholder="123456" maxlength="6" required>
    </div>
    <button id="verify-otp">Verify OTP</button>
    <button id="resend-otp" style="background: #6c757d; margin-top: 10px;">Resend OTP</button>
    <button id="back-to-phone" style="background: #999; margin-top: 10px;">Back</button>
    <div id="otp-error" class="error"></div>
  </div>

  <!-- Success Message -->
  <div id="success-message" class="auth-form hidden">
    <p class="success" style="text-align: center;">✓ Authentication successful!</p>
    <p style="text-align: center; color: #666; margin-top: 10px;">Redirecting to results page...</p>
  </div>

  <!-- Admin Section -->
  <div class="divider">
    <span>OR</span>
  </div>

  <div class="admin-link">
    <p style="color: #666; margin-bottom: 10px;">Admin Access?</p>
    <a href="./admin-login.html">Admin Login</a>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"></script>

<script>
  // Firebase configuration
  const firebaseConfig = {
    apiKey: "AIzaSyDCfxTtldJZZ9evhvNaiZ_sfUrZXQBEJBw",
    authDomain: "hrcresults-2ff45.firebaseapp.com",
    projectId: "hrcresults-2ff45",
    storageBucket: "hrcresults-2ff45.appspot.com",
    messagingSenderId: "1023633289816",
    appId: "1:1023633289816:web:YOUR_APP_ID"
  };

  // Initialize Firebase
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();

  // Check if already logged in
  if (sessionStorage.getItem('userPhoneVerified')) {
    window.location.href = './index.html';
  }

  // Enable reCAPTCHA
  window.recaptchaVerifier = new firebase.auth.RecaptchaVerifier('recaptcha-container', {
    'size': 'normal',
    'callback': (response) => {
      console.log('reCAPTCHA resolved');
    }
  });

  let confirmationResult;

  // Send OTP
  document.getElementById('send-otp').addEventListener('click', async () => {
    const phone = document.getElementById('phone').value.trim();
    const errorDiv = document.getElementById('phone-error');

    if (!phone || phone.length !== 10) {
      errorDiv.textContent = 'Please enter a valid 10-digit phone number';
      return;
    }

    const fullPhone = '+91' + phone;

    try {
      errorDiv.textContent = '';
      document.getElementById('send-otp').disabled = true;
      document.getElementById('send-otp').textContent = 'Sending...';

      // Check if phone exists in allowed users list
      const userDoc = await db.collection('allowed_users').doc(phone).get();
      if (!userDoc.exists) {
        errorDiv.textContent = 'This phone number is not registered. Contact admin.';
        document.getElementById('send-otp').disabled = false;
        document.getElementById('send-otp').textContent = 'Send OTP';
        return;
      }

      confirmationResult = await auth.signInWithPhoneNumber(fullPhone, window.recaptchaVerifier);
      
      // Show OTP input step
      document.getElementById('phone-step').classList.add('hidden');
      document.getElementById('otp-step').classList.remove('hidden');
      
      document.getElementById('send-otp').disabled = false;
      document.getElementById('send-otp').textContent = 'Send OTP';
    } catch (error) {
      errorDiv.textContent = 'Error: ' + error.message;
      document.getElementById('send-otp').disabled = false;
      document.getElementById('send-otp').textContent = 'Send OTP';
      
      // Reset reCAPTCHA
      if (window.recaptchaVerifier) {
        window.recaptchaVerifier.clear();
        window.recaptchaVerifier = new firebase.auth.RecaptchaVerifier('recaptcha-container', {
          'size': 'normal'
        });
      }
    }
  });

  // Verify OTP
  document.getElementById('verify-otp').addEventListener('click', async () => {
    const otp = document.getElementById('otp').value.trim();
    const errorDiv = document.getElementById('otp-error');

    if (!otp || otp.length !== 6) {
      errorDiv.textContent = 'Please enter a valid 6-digit OTP';
      return;
    }

    try {
      errorDiv.textContent = '';
      document.getElementById('verify-otp').disabled = true;
      document.getElementById('verify-otp').textContent = 'Verifying...';

      const result = await confirmationResult.confirm(otp);
      
      // Store authentication in sessionStorage
      sessionStorage.setItem('userPhoneVerified', 'true');
      sessionStorage.setItem('userPhone', result.user.phoneNumber);

      // Show success message
      document.getElementById('otp-step').classList.add('hidden');
      document.getElementById('success-message').classList.remove('hidden');

      // Redirect to index.html after 2 seconds
      setTimeout(() => {
        window.location.href = './index.html';
      }, 2000);
    } catch (error) {
      errorDiv.textContent = 'Invalid OTP. Please try again.';
      document.getElementById('verify-otp').disabled = false;
      document.getElementById('verify-otp').textContent = 'Verify OTP';
    }
  });

  // Resend OTP
  document.getElementById('resend-otp').addEventListener('click', async () => {
    const phone = document.getElementById('phone').value.trim();
    const fullPhone = '+91' + phone;
    const errorDiv = document.getElementById('otp-error');

    try {
      errorDiv.textContent = '';
      document.getElementById('resend-otp').disabled = true;
      document.getElementById('resend-otp').textContent = 'Resending...';

      confirmationResult = await auth.signInWithPhoneNumber(fullPhone, window.recaptchaVerifier);
      
      errorDiv.textContent = '';
      document.getElementById('otp').value = '';
      
      setTimeout(() => {
        document.getElementById('resend-otp').disabled = false;
        document.getElementById('resend-otp').textContent = 'Resend OTP';
      }, 2000);
    } catch (error) {
      errorDiv.textContent = 'Error resending OTP: ' + error.message;
      document.getElementById('resend-otp').disabled = false;
      document.getElementById('resend-otp').textContent = 'Resend OTP';
    }
  });

  // Back button
  document.getElementById('back-to-phone').addEventListener('click', () => {
    document.getElementById('otp-step').classList.add('hidden');
    document.getElementById('phone-step').classList.remove('hidden');
    document.getElementById('otp').value = '';
    document.getElementById('otp-error').textContent = '';
  });
</script>

</body>
</html>
