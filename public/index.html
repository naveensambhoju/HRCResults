<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HRC Results</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>

<div class="top-bar">
  <h2>Results</h2>
  <a href="./login.html" class="admin-btn">Admin</a>
</div>
<div id="results">Loading...</div>
<div id="timestamps" class="timestamps"></div>

 <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import {
      getFirestore,
      collection,
      getDocs,
      query,
      orderBy,
      limit
    } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDCfxTtldJZZ9evhvNaiZ_sfUrZXQBEJBw",
      authDomain: "HRCResults.firebaseapp.com",
      projectId: "hrcresults-2ff45"
    };

    // Deployment timestamp (updated by build script)
    const LAST_DEPLOYED = "2026-01-16T09:49:25.150Z";

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    window.readItems = async () => {
      const q = query(
        collection(db, "items"),
        orderBy("createdAt", "desc"),
        limit(1)
      );

      const snapshot = await getDocs(q);
      console.log("XXX ",snapshot);

      const data = snapshot.docs.length ? snapshot.docs[0].data() : {};
      const note = data.note || "";
      const results = data.results || "No data available";

      console.log(note, results);
      
      // Format results with comma separation and line breaks
      let formattedResults = results;
      if (results && results !== "No data available") {
        // Split by comma and rejoin with line breaks
        formattedResults = results
          .split(',')
          .map(item => item.trim())
          .join('\n');
      }
      
      // Display note first, then results
      let displayHTML = formattedResults.replace(/\n/g, '<br>');
      if (note) {
        displayHTML = note + '<br><br>' + displayHTML;
      }
      
      document.getElementById("results").innerHTML = displayHTML;
      
      // Display timestamps
      if (snapshot.docs.length > 0 && data.createdAt) {
        const createdAtDate = data.createdAt.toDate();
        const formattedTime = createdAtDate.toLocaleString('en-US', { 
          month: 'short', 
          day: 'numeric', 
          year: 'numeric',
          hour: 'numeric', 
          minute: '2-digit', 
          hour12: true 
        });
        
        // Format deployment timestamp
        const deployDate = new Date(LAST_DEPLOYED);
        const formattedDeployTime = deployDate.toLocaleString('en-US', { 
          month: 'short', 
          day: 'numeric', 
          year: 'numeric',
          hour: 'numeric', 
          minute: '2-digit', 
          hour12: true 
        });
        document.getElementById("timestamps").innerHTML = `<p>Last Updated: ${formattedTime}</p><p>Last Deployed: ${formattedDeployTime}</p>`;
      } else {
        document.getElementById("timestamps").innerHTML = '<p>No data available</p>';
      }
    };

    // Load data on page load
    window.readItems();
  </script>

</body>
</html>
