<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Public Content</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>

<div class="top-bar">
  <h2>Results</h2>
  <a href="./login.html" class="admin-btn">Admin</a>
</div>
<div id="results">Loading...</div>

 <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import {
      getFirestore,
      collection,
      getDocs,
      query,
      orderBy,
      limit
    } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDCfxTtldJZZ9evhvNaiZ_sfUrZXQBEJBw",
      authDomain: "HRCResults.firebaseapp.com",
      projectId: "hrcresults-2ff45"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    window.readItems = async () => {
      const q = query(
        collection(db, "items"),
        orderBy("createdAt", "desc"),
        limit(1)
      );

      const snapshot = await getDocs(q);
      console.log("XXX ",snapshot);

      const results = snapshot.docs.length
        ? snapshot.docs[0].data().results
        : "No data available";

      console.log(results);
      document.getElementById("results").innerHTML = results;
    };

    // Load data on page load
    window.readItems();
  </script>

</body>
</html>
