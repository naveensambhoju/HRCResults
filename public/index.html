<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Public Content</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>

<div class="top-bar">
  <h2>Public Content</h2>
  <a href="/login.html" class="admin-btn">Admin</a>
</div>
<div id="content">Loading...</div>

<script>
fetch('/content')
  .then(res => res.json())
  .then(data => {
    document.getElementById('content').innerText = data.text || '';
  })
  .catch(() => {
    document.getElementById('content').innerText = '';
  });
</script>

</body>
</html>
