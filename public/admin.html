<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>

<div style="position: absolute; top: 20px; right: 20px;">
  <a href="./index.html" class="home-btn">Home</a>
</div>

<div class="card">
  <h2>Admin Panel</h2>
  <label for="noteText">Note:</label>
  <textarea id="noteText" rows="2" placeholder="Enter note here..."></textarea><br><br>
  <label for="adminText">Results:</label>
  <textarea id="adminText" rows="15"></textarea><br><br>
  <button id="save">Save</button>
  <button id="logout" onclick="logout()">Logout</button>
</div>
<script>
  // Check if admin is logged in
  if (sessionStorage.getItem('isAdminLoggedIn') !== 'true') {
    window.location.href = './index-access.html';
  }

  function logout() {
    sessionStorage.removeItem('isAdminLoggedIn');
    window.location.href = './index-access.html';
  }
</script>
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import {
      getFirestore,
      collection,
      addDoc,
      getDocs,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDCfxTtldJZZ9evhvNaiZ_sfUrZXQBEJBw",
      authDomain: "HRCResults.firebaseapp.com",
      projectId: "hrcresults-2ff45"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    document.getElementById("save").onclick = async () => {
      const note = document.getElementById("noteText").value;
      const results = document.getElementById("adminText").value;
      try {
        await addDoc(collection(db, "items"), {
          note: note,
          results: results,
          createdAt : serverTimestamp()
        });
        alert("Saved successfully!");
        document.getElementById("noteText").value = "";
        document.getElementById("adminText").value = "";
      } catch (error) {
        alert("Error saving: " + error.message);
      }
    };

  </script>

<script src="/guard.js"></script>
</body>
</html>
